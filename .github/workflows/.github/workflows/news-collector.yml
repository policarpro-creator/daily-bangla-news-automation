
name: Daily Bangla News Collector

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

jobs:
  collect-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run RSS News Collector
        run: python news_automation.py
